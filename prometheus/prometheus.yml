global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'arena-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'auth-service:8081'
          - 'catalog-service:8082'
          - 'ticketing-service:8083'
          - 'notification-service:8084'