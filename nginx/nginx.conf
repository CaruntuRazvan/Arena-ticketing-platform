server {
    listen 443 ssl;
    server_name arena-ticketing.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/arena-ticketing.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena-ticketing.duckdns.org/privkey.pem;

    location /api {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}