server:
  port: 8082

spring:
  ai:
    google:
      genai:
        api-key: ${AI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.5
  datasource:
    url: jdbc:postgresql://localhost:5432/arena_catalog_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: -1
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/