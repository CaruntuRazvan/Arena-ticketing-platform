
server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/arena_auth_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: ${ARENA_JWT_SECRET}
    expiration: 86400000
    
management:
  endpoints:
    web:
      exposure:
        include: refresh, health, info