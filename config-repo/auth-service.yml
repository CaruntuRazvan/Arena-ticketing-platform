
server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/arena_auth_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USER}
    password: ${EMAIL_APP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: ${ARENA_JWT_SECRET}
    expiration: 86400000
    
management:
  endpoints:
    web:
      exposure:
        include: refresh, health, info