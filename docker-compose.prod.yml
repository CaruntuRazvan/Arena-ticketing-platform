services:
  # =========================================================================
  # 1. INFRASTRUCTURĂ
  # =========================================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_MULTIPLE_DATABASES: arena_auth_db,arena_catalog_db,arena_ticketing_db
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - arena-network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports: ["6379:6379"]
    networks:
      - arena-network

  discovery-server:
    image: carunturazvan/discovery-server:prod
    container_name: discovery-server
    ports: ["8761:8761"]
    networks:
      - arena-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8761 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  config-server:
    image: carunturazvan/config-server:prod
    container_name: config-server
    ports: ["8888:8888"]
    environment:
      - SPRING_PROFILES_ACTIVE=docker,native
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
    volumes:
      - ./config-repo:/app/config
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - arena-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8888 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. MICROSERVICII DE BUSINESS
  # =========================================================================
  auth-service:
    image: carunturazvan/auth-service:prod
    container_name: auth-service
    ports: ["8081:8081"]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/arena_auth_db
      - SPRING_DATA_REDIS_HOST=redis-cache
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password123}
      - ARENA_JWT_SECRET=${ARENA_JWT_SECRET}
    depends_on:
      postgres-db:
        condition: service_started
      redis-cache:
        condition: service_started
      config-server:
        condition: service_healthy
    networks:
      - arena-network

  catalog-service:
    image: carunturazvan/catalog-service:prod
    container_name: catalog-service
    ports: [ "8082:8082" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/arena_catalog_db
      - SPRING_DATA_REDIS_HOST=redis-cache
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password123}
      - AI_API_KEY=${AI_API_KEY}
      - LOG_PATH=/app/logs
    depends_on:
      postgres-db:
        condition: service_started
      redis-cache:
        condition: service_started
      config-server:
        condition: service_healthy
    networks:
      - arena-network

  ticketing-service:
    image: carunturazvan/ticketing-service:prod
    container_name: ticketing-service
    ports: [ "8083:8083" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/arena_ticketing_db
      - SPRING_DATA_REDIS_HOST=redis-cache
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password123}
      - LOG_PATH=/app/logs
    depends_on:
      postgres-db:
        condition: service_started
      redis-cache:
        condition: service_started
      config-server:
        condition: service_healthy
    networks:
      - arena-network

  notification-service:
    image: carunturazvan/notification-service:prod
    container_name: notification-service
    ports: [ "8084:8084" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASS=${EMAIL_APP_PASS}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - LOG_PATH=/app/logs
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - arena-network

  api-gateway:
    image: carunturazvan/api-gateway:prod
    container_name: api-gateway
    ports: [ "8080:8080" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis-cache
      - ARENA_JWT_SECRET=${ARENA_JWT_SECRET}
    depends_on:
      redis-cache:
        condition: service_started
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - arena-network

  frontend:
    image: carunturazvan/arena-frontend:prod
    container_name: frontend
    networks:
      - arena-network
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - arena-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # implicit
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - arena-network
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/arena-ticketing.duckdns.org:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
    networks:
      - arena-network
networks:
  arena-network:
    driver: bridge

volumes:
  pg-data:
  grafana-data: