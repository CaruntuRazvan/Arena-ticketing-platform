name: Arena Ticketing CI/CD

on:
  push:
    branches: [ dev, master ]

jobs:
  analyze:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v3
      - uses: github/codeql-action/init@v2
        with:
          languages: 'java'
      - uses: github/codeql-action/analyze@v2

  build:
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [discovery-server, config-server,api-gateway, auth-service, catalog-service, ticketing-service, notification-service]
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build & Test
        working-directory: ./${{ matrix.service }}
        env:
          MAVEN_OPTS: "-XX:+EnableDynamicAgentLoading"
        run: mvn clean package

  docker-push:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [discovery-server, config-server,api-gateway, auth-service, catalog-service, ticketing-service, notification-service]
    steps:
      - uses: actions/checkout@v3
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          # Dacă suntem pe master, tag-ul e 'prod', altfel e 'dev'
          TAG=${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
          
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:$TAG ./${{ matrix.service }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:$TAG