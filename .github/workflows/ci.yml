name: Arena Ticketing CI/CD

on:
  push:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

jobs:
  # 1. Build & Test
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - auth-service
          - catalog-service
          - ticketing-service
          - notification-service
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.service }}-${{ hashFiles(format('{0}/pom.xml', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.service }}-
            ${{ runner.os }}-maven-

      - name: Build & Test
        working-directory: ./${{ matrix.service }}
        env:
          MAVEN_OPTS: "-XX:+EnableDynamicAgentLoading"
        run: mvn clean package

  # 2. Docker Push cu versionare și cache
  docker-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - auth-service
          - catalog-service
          - ticketing-service
          - notification-service
          - arena-frontend
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push (master)
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:prod
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:v${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build & Push (dev)
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:dev
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 3. Deploy automat pe server - DOAR pe master
  deploy:
    needs: docker-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy pe VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/Arena-ticketing-platform
            git pull origin master
            export $(cat .env | xargs)
            export APP_VERSION=v${{ github.run_number }}

            echo "Tragerea imaginilor $APP_VERSION..."
            docker compose -f docker-compose.prod.yml pull

            echo "Deploy în curs..."
            if docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 300 --remove-orphans; then
              echo "Deploy reușit! Versiunea: $APP_VERSION"
              docker image prune -f
            else
              echo "Deploy eșuat! Rollback..."
              PREV_VERSION=v$(( ${{ github.run_number }} - 1 ))
              echo "Revenire la $PREV_VERSION..."
              export APP_VERSION=$PREV_VERSION
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
              echo "Rollback la $PREV_VERSION finalizat!"
              exit 1
            fi