name: Arena Ticketing CI/CD

on:
  push:
    branches: [ dev, master ]

jobs:
  # 1. Build & Test: Rulează unit testele pentru tot stack-ul
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - auth-service
          - catalog-service
          - ticketing-service
          - notification-service
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & Test
        working-directory: ./${{ matrix.service }}
        env:
          MAVEN_OPTS: "-XX:+EnableDynamicAgentLoading"
        run: mvn clean package

  # 2. Docker Push: Construiește și urcă imaginile doar dacă testele trec
  docker-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - auth-service
          - catalog-service
          - ticketing-service
          - notification-service
    steps:
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        run: |
          # Dacă suntem pe master, tag-ul e 'prod', altfel e 'dev'
          TAG=${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
          
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:$TAG ./${{ matrix.service }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:$TAG